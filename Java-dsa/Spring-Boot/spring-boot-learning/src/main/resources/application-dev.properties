# =============================================================================
#  Loaded ONLY when the "dev" profile is active, ON TOP of application.properties.
#  Same keys here OVERRIDE the defaults; keys not mentioned keep their default.
#  Run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# =============================================================================
app.store.name=Learning Store (DEV)
app.features.personalized-recommendations=false

# Print SQL in development (see the N+1 problem with your own eyes)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
