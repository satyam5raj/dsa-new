# =============================================================================
#  application.properties - the DEFAULT configuration (applies to every profile)
# =============================================================================
#  Property SOURCES, highest priority first (later ones are overridden):
#    1. Command-line args          --server.port=9090
#    2. Environment variables      SERVER_PORT=9090   (relaxed binding: dots -> _, upper case)
#    3. application-{profile}.properties   (e.g. application-dev.properties)
#    4. application.properties     (this file)
#    5. @PropertySource / defaults in code
#  Activate a profile:  --spring.profiles.active=dev   or   SPRING_PROFILES_ACTIVE=dev
# =============================================================================

spring.application.name=spring-boot-learning
server.port=8080

# ---------- Database (H2 in-memory, recreated on every start) ----------
spring.datasource.url=jdbc:h2:mem:learning;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# Open-Session-In-View keeps a DB connection open for the WHOLE web request so
# lazy loading "just works" in controllers. It hides N+1 problems and holds
# connections longer than needed -> turn it OFF (Spring Boot even warns about it).
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---------- Our own typed settings (bound to config.StoreProperties) ----------
app.store.name=Learning Store
app.store.max-items-per-order=5
app.store.support-email=help@learning.dev
app.store.order-timeout=30s

# Feature toggle used by @ConditionalOnProperty (config.FeatureConfig)
app.features.personalized-recommendations=true

# ---------- JWT (security package) ----------
# DEV-ONLY secret (base64, 256-bit). In production inject it from a secret
# manager / env var:  APP_JWT_SECRET=...   NEVER commit real secrets.
app.jwt.secret=RIhqNs9M6pPHUUJDzAuZ/wKuYWrbrYYhdexZ78b+W+s=
app.jwt.issuer=spring-boot-learning
app.jwt.ttl=1h

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,beans,conditions,env,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.description=Spring Boot learning project
info.app.java-version=${java.version}
