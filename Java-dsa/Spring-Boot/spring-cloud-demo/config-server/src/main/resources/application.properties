spring.application.name=config-server
server.port=8888

# "native" backend = serve files from the classpath folder below (no Git repo needed for the demo).
# Production usually uses:  spring.cloud.config.server.git.uri=https://github.com/<org>/config-repo
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo
