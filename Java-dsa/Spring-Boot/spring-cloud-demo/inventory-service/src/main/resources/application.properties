spring.application.name=inventory-service
# Port is passed on the command line (8081, 8082) to run TWO instances
server.port=${PORT:8081}

# Fetch the rest of the config from the Config Server BEFORE the context starts.
# "optional:" = still start if the config server is down (fall back to local values).
spring.config.import=optional:configserver:http://localhost:8888

# Local fallback if the config server is unreachable
inventory.warehouse-name=LOCAL fallback warehouse
